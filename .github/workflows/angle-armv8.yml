name: ANGLE Android ARMv8.0 - Shared and Static Libraries

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - es3-mobileglues

permissions:
  contents: read

concurrency:
  group: angle-armv8-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  DEPOT_TOOLS_UPDATE: "0"
  DEPOT_TOOLS_METRICS: "0"
  GCLIENT_PY3: "1"
  GIT_TERMINAL_PROMPT: "0"
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build-arm64-v8:
    name: Build Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: angle
          fetch-depth: 1
          submodules: recursive
          persist-credentials: true

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            bison \
            build-essential \
            ccache \
            clang \
            cmake \
            curl \
            flex \
            file \
            git \
            libasound2-dev \
            libdrm-dev \
            libglib2.0-dev \
            libnss3-dev \
            libpulse-dev \
            libspeechd-dev \
            libx11-xcb-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxi-dev \
            libxrandr-dev \
            libxshmfence-dev \
            libxtst-dev \
            lld \
            llvm \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            unzip \
            zip

          ccache --version
          clang --version
          ninja --version
          python3 --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-angle-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-angle-${{ runner.os }}-${{ github.ref_name }}-
            ccache-angle-${{ runner.os }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Bootstrap depot_tools
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$HOME/depot_tools"

          git clone \
            --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

          export PATH="$HOME/depot_tools:$PATH"

          command -v gclient
          gclient --version

      - name: Create gclient configuration
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
          REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          cat > .gclient <<EOF
          solutions = [
            {
              "name": "angle",
              "url": "${REPOSITORY}",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]

          target_os = ["android"]
          EOF

          echo "Repository: ${REPOSITORY}"
          echo "Revision: ${REVISION}"
          cat .gclient

      - name: Synchronize ANGLE dependencies
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          gclient sync \
            --force \
            --no-history \
            --reset \
            --delete_unversioned_trees \
            --revision "angle@${REVISION}"

      - name: Install ANGLE build dependencies
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          if [ -f angle/build/install-build-deps.sh ]; then
            sudo bash angle/build/install-build-deps.sh \
              --no-prompt \
              --lib32 \
              || sudo bash angle/build/install-build-deps.sh --no-prompt
          fi

          gclient runhooks

      - name: Verify build tools
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          "$HOME/depot_tools/ensure_bootstrap"

          command -v gn
          command -v autoninja
          command -v ninja

          gn --version
          autoninja --version
          ninja --version

      - name: Apply build compatibility fixes
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("BUILD.gn")

          if not path.exists():
              raise SystemExit("BUILD.gn was not found")

          text = path.read_text(encoding="utf-8")

          # Fixes the invalid path:
          # import("//build_overrides//vulkan_headers.gni")
          text = text.replace(
              'import("//build_overrides//vulkan_headers.gni")',
              'import("//build_overrides/vulkan_headers.gni")',
          )

          path.write_text(text, encoding="utf-8")
          print("BUILD.gn compatibility fix applied")
          PY

          grep -n "vulkan_headers.gni" BUILD.gn

      - name: Generate GN configuration
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          rm -rf out/AndroidArmv8
          mkdir -p out/AndroidArmv8

          cat > out/AndroidArmv8/args.gn <<'EOF'
          target_os = "android"
          target_cpu = "arm64"
          current_cpu = "arm64"

          is_debug = false
          is_component_build = false
          is_official_build = true

          symbol_level = 0
          enable_nacl = false
          use_thin_lto = false
          use_remoteexec = false
          is_cfi = false
          arm_control_flow_integrity = "none"

          android32_ndk_api_level = 26
          android64_ndk_api_level = 26

          angle_build_tests = false
          build_angle_deqp_tests = false
          build_angle_end2end_tests_library = false

          angle_enable_vulkan = true
          angle_enable_gl = false
          angle_enable_d3d11 = false
          angle_enable_metal = false
          angle_enable_swiftshader = false
          angle_enable_null = false
          angle_enable_wgpu = false
          angle_enable_cl = false
          angle_enable_cl_passthrough = false

          angle_enable_vulkan_validation_layers = false
          angle_enable_vulkan_api_dump_layer = false
          angle_debug_layers_enabled = false
          angle_enable_trace = false
          angle_enable_trace_android_logcat = false
          angle_enable_trace_events = false
          angle_enable_memory_alloc_logging = false
          angle_enable_unwind_backtrace_support = false

          angle_use_partition_alloc = false
          checkout_angle_partition_alloc = false

          angle_enable_explicit_context = false
          angle_enable_share_context_lock = false
          angle_enable_global_mutex_recursion = false
          angle_enable_global_mutex_load_time_allocate = false
          angle_enable_context_mutex = true
          angle_enable_context_mutex_recursion = false

          angle_vulkan_display_mode = "simple"
          angle_libs_suffix = "_angle"

          extra_cflags = [
            "-march=armv8-a",
            "-mtune=generic",
            "-mno-outline-atomics",
          ]

          extra_cxxflags = [
            "-march=armv8-a",
            "-mtune=generic",
            "-mno-outline-atomics",
          ]

          extra_asmflags = [
            "-march=armv8-a",
          ]
          EOF

          gn gen out/AndroidArmv8

          gn args out/AndroidArmv8 --list > out/AndroidArmv8/gn-args.txt

          test -f out/AndroidArmv8/build.ninja
          test -f out/AndroidArmv8/args.gn

          echo "GN generation completed successfully"
          cat out/AndroidArmv8/args.gn

      - name: Discover ANGLE targets
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          autoninja \
            -C out/AndroidArmv8 \
            -t targets \
            > "$GITHUB_WORKSPACE/angle-targets.txt"

          test -s "$GITHUB_WORKSPACE/angle-targets.txt"

          echo "Relevant targets:"
          grep -E \
            '(^|/)(libEGL|libGLESv2|libGLESv1_CM)(:|$)' \
            "$GITHUB_WORKSPACE/angle-targets.txt" \
            || true

      - name: Build shared ANGLE libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          autoninja \
            -C out/AndroidArmv8 \
            -j2 \
            libEGL \
            libGLESv2 \
            libGLESv1_CM

          mapfile -t SHARED_LIBRARIES < <(
            find out/AndroidArmv8 \
              -type f \
              -name '*.so' \
              -not -path '*/obj/*' \
              -print
          )

          if [ "${#SHARED_LIBRARIES[@]}" -eq 0 ]; then
            echo "ERROR: no shared libraries were produced"
            find out/AndroidArmv8 -type f | sort | tail -200
            exit 1
          fi

          printf '%s\n' "${SHARED_LIBRARIES[@]}"

      - name: Build static ANGLE libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          mapfile -t STATIC_TARGETS < <(
            grep -Eo \
              '(^|/)(angle_[A-Za-z0-9_]*|lib[A-Za-z0-9_]*_static)(:|$)' \
              "$GITHUB_WORKSPACE/angle-targets.txt" \
              | sed -E 's#(^|/)([^:]+):?$#\2#' \
              | sort -u \
              | grep -E \
                '(^angle_.*static$|^lib.*_static$|^angle_common$|^translator$|^preprocessor$)' \
              || true
          )

          if [ "${#STATIC_TARGETS[@]}" -gt 0 ]; then
            echo "Building discovered static targets:"
            printf '  %s\n' "${STATIC_TARGETS[@]}"

            autoninja \
              -C out/AndroidArmv8 \
              -j2 \
              "${STATIC_TARGETS[@]}" \
              || true
          else
            echo "No explicit static targets were exposed; collecting static archives generated as dependencies."
          fi

          mapfile -t STATIC_LIBRARIES < <(
            find out/AndroidArmv8 \
              -type f \
              -name '*.a' \
              -not -path '*/obj/*' \
              -print
          )

          if [ "${#STATIC_LIBRARIES[@]}" -eq 0 ]; then
            echo "ERROR: no static libraries were produced"
            find out/AndroidArmv8 -type f | sort | tail -200
            exit 1
          fi

          printf '%s\n' "${STATIC_LIBRARIES[@]}"

      - name: Collect shared and static libraries
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf angle-package
          mkdir -p \
            angle-package/arm64-v8a/shared \
            angle-package/arm64-v8a/static

          find angle/out/AndroidArmv8 \
            -type f \
            -name '*.so' \
            -not -path '*/obj/*' \
            -exec cp -v {} angle-package/arm64-v8a/shared/ \;

          find angle/out/AndroidArmv8 \
            -type f \
            -name '*.a' \
            -not -path '*/obj/*' \
            -exec cp -v {} angle-package/arm64-v8a/static/ \;

          SO_COUNT="$(find angle-package/arm64-v8a/shared -type f -name '*.so' | wc -l)"
          A_COUNT="$(find angle-package/arm64-v8a/static -type f -name '*.a' | wc -l)"

          if [ "$SO_COUNT" -eq 0 ]; then
            echo "ERROR: package contains no .so files"
            exit 1
          fi

          if [ "$A_COUNT" -eq 0 ]; then
            echo "ERROR: package contains no .a files"
            exit 1
          fi

          echo "Shared libraries: $SO_COUNT"
          echo "Static libraries: $A_COUNT"

          find angle-package -type f | sort

      - name: Verify ARM64 shared libraries
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r -d '' library; do
            echo "Verifying: $library"

            file "$library"

            file "$library" | grep -E \
              'ELF 64-bit.*(ARM aarch64|AArch64|aarch64)'
          done < <(
            find angle-package/arm64-v8a/shared \
              -type f \
              -name '*.so' \
              -print0
          )

      - name: Verify static archives
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail

          command -v llvm-ar || command -v ar

          while IFS= read -r -d '' archive; do
            echo "Verifying: $archive"

            file "$archive"

            if command -v llvm-ar >/dev/null 2>&1; then
              llvm-ar t "$archive" >/dev/null
            else
              ar t "$archive" >/dev/null
            fi
          done < <(
            find angle-package/arm64-v8a/static \
              -type f \
              -name '*.a' \
              -print0
          )

      - name: Verify ARMv8.0-A instruction set
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail

          OBJDUMP="$(command -v llvm-objdump || true)"

          if [ -z "$OBJDUMP" ]; then
            echo "llvm-objdump not found; skipping disassembly validation"
            exit 0
          fi

          while IFS= read -r -d '' library; do
            echo "Checking ARMv8.0-A instructions in: $library"

            disassembly="${library}.dis"
            "$OBJDUMP" -d "$library" > "$disassembly" || true

            if grep -Eiq \
              '\b(ldadd|ldclr|ldeor|ldset|swp|casp|stadd|stclr|steor|stset|crc32|crc32c|fcmla|fmlal|sdot|udot|bfmmla|sve|whilelo|ptrue|cntb|addvl)\b' \
              "$disassembly"; then
              echo "ERROR: ARMv8.1+ instruction detected in $library"
              grep -Ein \
                '\b(ldadd|ldclr|ldeor|ldset|swp|casp|stadd|stclr|steor|stset|crc32|crc32c|fcmla|fmlal|sdot|udot|bfmmla|sve|whilelo|ptrue|cntb|addvl)\b' \
                "$disassembly" \
                | head -50
              exit 1
            fi

            rm -f "$disassembly"
            echo "ARMv8.0-A validation passed: $library"
          done < <(
            find angle-package/arm64-v8a/shared \
              -type f \
              -name '*.so' \
              -print0
          )

      - name: Create ZIP package
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f angle-arm64-v8a.zip

          zip -9 -X -r \
            angle-arm64-v8a.zip \
            angle-package/arm64-v8a

          test -s angle-arm64-v8a.zip

          unzip -l angle-arm64-v8a.zip

      - name: Print build summary
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## ANGLE Android ARMv8.0 build"
            echo
            echo "### Shared libraries (.so)"
            find angle-package/arm64-v8a/shared \
              -type f \
              -name '*.so' \
              -printf '%f\n' \
              | sort
            echo
            echo "### Static libraries (.a)"
            find angle-package/arm64-v8a/static \
              -type f \
              -name '*.a' \
              -printf '%f\n' \
              | sort
            echo
            echo "### ZIP"
            ls -lh angle-arm64-v8a.zip
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .so, .a and ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angle-arm64-v8a-armv8-0
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          path: |
            angle-arm64-v8a.zip
            angle-package/arm64-v8a/shared/*.so
            angle-package/arm64-v8a/static/*.a
