name: ANGLE Android ARMv8.0 - Shared and Static Libraries

on:
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout ANGLE
        uses: actions/checkout@v4
        with:
          path: angle
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            curl \
            wget \
            unzip \
            zip \
            xz-utils \
            bzip2 \
            ninja-build \
            clang \
            lld \
            build-essential \
            pkg-config \
            file \
            binutils \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxdamage-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            mesa-common-dev \
            libwayland-dev \
            wayland-protocols \
            libwayland-egl-backend-dev \
            libvulkan-dev \
            vulkan-tools \
            libudev-dev \
            libpulse-dev \
            libasound2-dev \
            libnss3-dev \
            libnspr4-dev \
            libgtk-3-dev \
            ccache

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          ccache --version
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: angle-android-arm64-ccache-v8.0-nocrc-nolse-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            angle-android-arm64-ccache-v8.0-nocrc-nolse-${{ runner.os }}-

      - name: Bootstrap depot_tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$HOME/depot_tools"

          # Full clone is more reliable than --depth=1 for depot_tools bootstrap.
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"

          export PATH="$HOME/depot_tools:$HOME/depot_tools/.cipd_bin:$PATH"

          # Keep the path available in later steps
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
          echo "$HOME/depot_tools/.cipd_bin" >> "$GITHUB_PATH"

          # This is the step that installs luci-auth and related bootstrap bits.
          "$HOME/depot_tools/ensure_bootstrap"

          command -v luci-auth
          command -v gclient
          command -v cipd
          command -v gn
          command -v autoninja
          command -v ninja

      - name: Create .gclient
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "angle",
              "url": "https://chromium.googlesource.com/angle/angle.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]

          target_os = ["android"]
          target_os_only = True
          EOF

          cat .gclient

      - name: Sync dependencies
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$HOME/depot_tools/.cipd_bin:$PATH"

          gclient sync --force --no-history --shallow

      - name: Install ANGLE build dependencies
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$HOME/depot_tools/.cipd_bin:$PATH"

          if [ -f scripts/install-build-deps.py ]; then
            python3 scripts/install-build-deps.py \
              --no-prompt \
              --no-chromeos-fonts \
              --no-arm || true
          fi

      - name: Run hooks
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$HOME/depot_tools/.cipd_bin:$PATH"

          gclient runhooks

      - name: Install Linux host sysroot
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$HOME/depot_tools/.cipd_bin:$PATH"

          python3 build/linux/sysroot_scripts/install-sysroot.py \
            --arch=amd64

          test -d build/linux/debian_bullseye_amd64-sysroot

      - name: Ensure GN binary exists
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$HOME/depot_tools/.cipd_bin:$PATH"

          mkdir -p angle/buildtools/linux64

          if [ -x angle/buildtools/linux64/gn ]; then
            angle/buildtools/linux64/gn --version
            exit 0
          fi

          rm -rf /tmp/gn-cipd
          mkdir -p /tmp/gn-cipd

          printf '%s\n' \
            '$VerifiedPlatform linux-amd64' \
            'gn/gn/${platform} latest' \
            > /tmp/gn.ensure

          cipd ensure \
            -root /tmp/gn-cipd \
            -ensure-file /tmp/gn.ensure

          GN_SRC="$(
            find /tmp/gn-cipd \
              -type f \
              -name gn \
              -perm -111 \
              | head -1
          )"

          if [ -z "$GN_SRC" ]; then
            rm -rf /tmp/gn-cipd
            mkdir -p /tmp/gn-cipd

            printf '%s\n' \
              '$VerifiedPlatform linux-amd64' \
              'infra/3pp/tools/gn/${platform} latest' \
              > /tmp/gn.ensure

            cipd ensure \
              -root /tmp/gn-cipd \
              -ensure-file /tmp/gn.ensure

            GN_SRC="$(
              find /tmp/gn-cipd \
                -type f \
                -name gn \
                -perm -111 \
                | head -1
            )"
          fi

          test -n "$GN_SRC"

          cp -v "$GN_SRC" angle/buildtools/linux64/gn
          chmod +x angle/buildtools/linux64/gn

          angle/buildtools/linux64/gn --version

      - name: Apply BUILD.gn compatibility fix
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f build_overrides/BUILD.gn ]; then
            sed -i \
              's#import("//build_overrides//vulkan_headers.gni")#import("//build_overrides/vulkan_headers.gni")#g' \
              build_overrides/BUILD.gn
          fi

      - name: Force ARMv8.0-A source configuration
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("build/config/arm.gni"),
              Path("build/config/compiler/BUILD.gn"),
              Path("build/config/android/BUILD.gn"),
          ]

          for path in candidates:
              if not path.exists():
                  print(f"skip: {path}")
                  continue

              text = path.read_text(encoding="utf-8", errors="replace")
              original = text

              replacements = [
                  (r'arm_arch\s*=\s*"[^"]*"', 'arm_arch = "armv8-a"'),
                  (r'arm_tune\s*=\s*"[^"]*"', 'arm_tune = "generic"'),
                  (r'arm_use_crc\s*=\s*true', 'arm_use_crc = false'),
                  (r'arm_use_lse\s*=\s*true', 'arm_use_lse = false'),
              ]

              for pattern, replacement in replacements:
                  text = re.sub(pattern, replacement, text)

              text = re.sub(
                  r'(-march=armv[^"\'\s]*?)(\+(?:lse|crc|dotprod|fp16|sve|rdm|atomics))+',
                  r'\1',
                  text,
              )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  print(f"patched: {path}")
              else:
                  print(f"no change: {path}")
          PY

          LEAKS="$(
            grep -rnE \
              '\+lse|\+crc|arm_use_lse[[:space:]]*=[[:space:]]*true|arm_use_crc[[:space:]]*=[[:space:]]*true' \
              build/config/arm.gni \
              build/config/compiler/BUILD.gn \
              build/config/android/BUILD.gn \
              2>/dev/null || true
          )"

          if [ -n "$LEAKS" ]; then
            echo "❌ ARMv8.1+ configuration found:"
            echo "$LEAKS"
            exit 1
          fi

          echo "✅ No LSE/CRC ARM configuration found."

      - name: Generate GN configuration
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$HOME/depot_tools/.cipd_bin:$PATH"

          rm -rf out/AndroidArmv8
          mkdir -p out/AndroidArmv8

          cat > out/AndroidArmv8/args.gn <<'EOF'
          target_os = "android"
          target_cpu = "arm64"
          current_cpu = "arm64"

          is_debug = false
          is_component_build = false
          is_official_build = false
          symbol_level = 0

          enable_nacl = false
          use_remoteexec = false
          clang_use_chrome_plugins = false

          use_thin_lto = false
          use_lto = false
          lto_unit_merging = false
          thin_lto_enable_optimizations = false

          is_cfi = false
          arm_control_flow_integrity = "none"

          android_ndk_api_level = 26

          arm_arch = "armv8-a"
          arm_tune = "generic"
          arm_use_neon = true
          arm_optionally_use_neon = false
          arm_use_crc = false
          arm_use_lse = false

          angle_armv80_strict = true
          angle_expose_non_conformant_extensions_and_versions = false

          angle_enable_vulkan = true
          angle_enable_gl = false
          angle_enable_d3d11 = false
          angle_enable_metal = false
          angle_enable_swiftshader = false
          angle_enable_null = false
          angle_enable_wgpu = false
          angle_enable_cl = false
          angle_enable_cl_passthrough = false

          angle_enable_vulkan_validation_layers = false
          angle_enable_vulkan_api_dump_layer = false
          angle_enable_vulkan_trace = false
          angle_debug_layers_enabled = false
          angle_vulkan_display_mode = "simple"

          angle_libs_suffix = "_angle"

          angle_build_tests = false
          angle_build_samples = false
          angle_build_perftests = false

          use_custom_libcxx = false
          treat_warnings_as_errors = false

          angle_enable_trace = false
          angle_enable_trace_android_logcat = false
          angle_enable_trace_events = false
          angle_enable_memory_alloc_logging = false
          angle_enable_unwind_backtrace_support = false

          checkout_angle_partition_alloc = false
          angle_use_partition_alloc = false

          extra_cflags = [
            "-march=armv8-a",
            "-mtune=generic",
            "-mno-outline-atomics",
            "-mno-lse",
            "-mno-crc",
            "-mno-fp16",
            "-mno-dotprod",
            "-mno-sve",
            "-mno-sve2",
            "-mno-i8mm",
            "-mno-bf16",
            "-Wno-error",
          ]

          extra_cxxflags = [
            "-march=armv8-a",
            "-mtune=generic",
            "-mno-outline-atomics",
            "-mno-lse",
            "-mno-crc",
            "-mno-fp16",
            "-mno-dotprod",
            "-mno-sve",
            "-mno-sve2",
            "-mno-i8mm",
            "-mno-bf16",
            "-Wno-error",
          ]

          extra_asmflags = [
            "-march=armv8-a",
            "-mno-outline-atomics",
            "-mno-crc",
          ]
          EOF

          cat out/AndroidArmv8/args.gn

          buildtools/linux64/gn gen out/AndroidArmv8

      - name: Verify generated target flags
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$HOME/depot_tools/.cipd_bin:$PATH"

          ninja -C out/AndroidArmv8 -t commands > /tmp/ninja-commands.txt

          if grep -nE \
            -- \
            '\+lse|\+crc|-march=armv8\.[1-9]|-mcpu=[^ ]*(native|armv8\.[1-9])|-moutline-atomics' \
            /tmp/ninja-commands.txt \
            | head -30; then
            echo "❌ Forbidden ARMv8.1+ compiler flags found."
            exit 1
          fi

          echo "✅ No forbidden ARMv8.1+ compiler flags found."

      - name: Build shared libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$HOME/depot_tools/.cipd_bin:$PATH"

          CCACHE_DISABLE=1 autoninja -C out/AndroidArmv8 \
            libEGL \
            libGLESv2 \
            libGLESv1_CM

      - name: Verify final ARMv8.0 shared libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euo pipefail

          OBJDUMP="$(
            find third_party/llvm-build \
              -type f \
              -name llvm-objdump \
              -perm -111 \
              | head -1
          )"

          test -n "$OBJDUMP"
          test -x "$OBJDUMP"

          FAILED=0

          check_library() {
            local lib="$1"

            echo ""
            echo "========================================"
            echo "Verifying: $lib"
            echo "========================================"

            if [ ! -f "$lib" ]; then
              echo "❌ Missing library: $lib"
              FAILED=1
              return
            fi

            local file_info
            file_info="$(file "$lib")"

            echo "$file_info"

            if ! echo "$file_info" | grep -Eq \
              'ELF 64-bit LSB shared object, ARM aarch64'; then
              echo "❌ Not an ARM64 Android shared library: $lib"
              FAILED=1
              return
            fi

            if ! readelf -h "$lib" | grep -q 'Class:.*ELF64'; then
              echo "❌ $lib is not ELF64"
              FAILED=1
              return
            fi

            if ! readelf -h "$lib" | grep -q 'Machine:.*AArch64'; then
              echo "❌ $lib is not AArch64"
              FAILED=1
              return
            fi

            "$OBJDUMP" \
              --arch-name=aarch64 \
              -d "$lib" \
              > /tmp/armv80-library.asm

            local hits
            hits="$(
              grep -Ein \
                '\b(ldadd[a-z]*|ldclr[a-z]*|ldeor[a-z]*|ldset[a-z]*|swp[a-z]*|casp[a-z]*|stadd[a-z]*|stclr[a-z]*|steor[a-z]*|stset[a-z]*|crc32[bwhx]|crc32c[bwhx]|sdot|udot|fcmla|fmlal|fmlsl|bfmmla|bfdot|usmmla|smmla|ptrue|whilelo|whilelt|sqaddv|sqsubv)\b' \
                /tmp/armv80-library.asm \
                | head -30 || true
            )"

            if [ -n "$hits" ]; then
              echo "❌ ARMv8.1+ instructions found in $lib:"
              echo "$hits"
              FAILED=1
            else
              echo "✅ ARMv8.0-only: $lib"
            fi

            rm -f /tmp/armv80-library.asm
          }

          check_library out/AndroidArmv8/libEGL_angle.so
          check_library out/AndroidArmv8/libGLESv2_angle.so
          check_library out/AndroidArmv8/libGLESv1_CM_angle.so

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "❌ One or more final ARM64 libraries failed validation."
            exit 1
          fi

          echo ""
          echo "✅ All final shared libraries passed ARMv8.0 validation."

      - name: Discover static targets
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          ninja -C out/AndroidArmv8 -t targets all \
            | awk '$1 ~ /\.a$/ { print $1 }' \
            | sort -u \
            > static-targets.txt || true

          cat static-targets.txt || true

      - name: Build static libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$HOME/depot_tools/.cipd_bin:$PATH"

          if [ -s static-targets.txt ]; then
            while IFS= read -r target; do
              [ -z "$target" ] && continue

              echo "Building static target: $target"
              autoninja -C out/AndroidArmv8 "$target"
            done < static-targets.txt
          else
            echo "No static targets found."
          fi

      - name: Verify static libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euo pipefail

          OBJDUMP="$(
            find third_party/llvm-build \
              -type f \
              -name llvm-objdump \
              -perm -111 \
              | head -1
          )"

          test -n "$OBJDUMP"
          test -x "$OBJDUMP"

          FAILED=0

          while IFS= read -r -d '' lib; do
            echo ""
            echo "Checking static library: $lib"

            FILE_INFO="$(file "$lib")"
            echo "$FILE_INFO"

            if ! echo "$FILE_INFO" | grep -Eq \
              'ARM aarch64|ARM64'; then
              echo "Skipping non-AArch64 archive: $lib"
              continue
            fi

            HITS="$(
              "$OBJDUMP" \
                --arch-name=aarch64 \
                -d "$lib" 2>/dev/null \
                | grep -Ein \
                  '\b(ldadd[a-z]*|ldclr[a-z]*|ldeor[a-z]*|ldset[a-z]*|swp[a-z]*|casp[a-z]*|stadd[a-z]*|stclr[a-z]*|steor[a-z]*|stset[a-z]*|crc32[bwhx]|crc32c[bwhx]|sdot|udot|fcmla|fmlal|fmlsl|bfmmla|bfdot|usmmla|smmla|ptrue|whilelo|whilelt)\b' \
                | head -20 || true
            )"

            if [ -n "$HITS" ]; then
              echo "❌ Forbidden ARM instruction found in $lib:"
              echo "$HITS"
              FAILED=1
            else
              echo "✅ ARMv8.0-only: $lib"
            fi
          done < <(
            find out/AndroidArmv8 \
              -type f \
              -name '*.a' \
              ! -path '*/clang_x64/*' \
              -print0
          )

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo ""
          echo "✅ Static library verification passed."

      - name: Collect libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf package

          mkdir -p package/lib
          mkdir -p package/include

          cp -v out/AndroidArmv8/libEGL_angle.so package/lib/
          cp -v out/AndroidArmv8/libGLESv2_angle.so package/lib/
          cp -v out/AndroidArmv8/libGLESv1_CM_angle.so package/lib/

          if [ -d include ]; then
            cp -r include/* package/include/ || true
          fi

          find package -type f | sort
          ls -lh package/lib/*.so

      - name: Final ARMv8.0 package verification
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euo pipefail

          OBJDUMP="$(
            find third_party/llvm-build \
              -type f \
              -name llvm-objdump \
              -perm -111 \
              | head -1
          )"

          test -n "$OBJDUMP"
          test -x "$OBJDUMP"

          FAILED=0

          for file in package/lib/*.so; do
            [ -f "$file" ] || continue

            echo ""
            echo "Analyzing final package file: $file"

            FILE_INFO="$(file "$file")"
            echo "$FILE_INFO"

            if ! echo "$FILE_INFO" | grep -Eq \
              'ELF 64-bit LSB shared object, ARM aarch64'; then
              echo "❌ Invalid Android ARM64 library: $file"
              FAILED=1
              continue
            fi

            if ! readelf -h "$file" | grep -q 'Class:.*ELF64'; then
              echo "❌ Not ELF64: $file"
              FAILED=1
              continue
            fi

            if ! readelf -h "$file" | grep -q 'Machine:.*AArch64'; then
              echo "❌ Not AArch64: $file"
              FAILED=1
              continue
            fi

            "$OBJDUMP" \
              --arch-name=aarch64 \
              -d "$file" \
              > /tmp/final-armv80.asm

            HITS="$(
              grep -Ein \
                '\b(ldadd[a-z]*|ldclr[a-z]*|ldeor[a-z]*|ldset[a-z]*|swp[a-z]*|casp[a-z]*|stadd[a-z]*|stclr[a-z]*|steor[a-z]*|stset[a-z]*|crc32[bwhx]|crc32c[bwhx]|sdot|udot|fcmla|fmlal|fmlsl|bfmmla|bfdot|usmmla|smmla|ptrue|whilelo|whilelt|sqaddv|sqsubv)\b' \
                /tmp/final-armv80.asm \
                | head -30 || true
            )"

            if [ -n "$HITS" ]; then
              echo "❌ ARMv8.1+ instructions found in final package: $file"
              echo "$HITS"
              FAILED=1
            else
              echo "✅ CLEAN ARMv8.0-A: $file"
            fi

            rm -f /tmp/final-armv80.asm
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "❌ Final package failed ARMv8.0-A validation."
            exit 1
          fi

          echo ""
          echo "✅ Final package is ARMv8.0-A compatible."

      - name: Package
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          cd package
          zip -9 -r ../ANGLE-Android-ARMv8.0.zip .
          cd ..

          ls -lh ANGLE-Android-ARMv8.0.zip

      - name: Upload ANGLE package
        uses: actions/upload-artifact@v4
        with:
          name: ANGLE-Android-ARMv8.0
          path: angle/ANGLE-Android-ARMv8.0.zip
          if-no-files-found: error
