name: ANGLE Android ARMv8.0 - Shared and Static Libraries

on:
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout ANGLE
        uses: actions/checkout@v4
        with:
          path: angle
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            curl \
            wget \
            unzip \
            zip \
            xz-utils \
            bzip2 \
            ninja-build \
            clang \
            lld \
            build-essential \
            pkg-config \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxdamage-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            mesa-common-dev \
            libwayland-dev \
            wayland-protocols \
            libwayland-egl-backend-dev \
            libvulkan-dev \
            vulkan-tools \
            libudev-dev \
            libpulse-dev \
            libasound2-dev \
            libnss3-dev \
            libnspr4-dev \
            libgtk-3-dev \
            ccache

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          ccache --version

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: angle-android-arm64-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            angle-android-arm64-ccache-${{ runner.os }}-

      - name: Bootstrap depot_tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$HOME/depot_tools"

          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"

          export PATH="$HOME/depot_tools:$PATH"

          "$HOME/depot_tools/ensure_bootstrap"

          command -v gclient
          command -v cipd
          command -v gn
          command -v autoninja
          command -v ninja

      - name: Create .gclient
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "angle",
              "url": "https://chromium.googlesource.com/angle/angle.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]

          target_os = ["android"]
          target_os_only = True
          EOF

          echo "===== .gclient ====="
          cat .gclient

      - name: Sync dependencies
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          gclient sync \
            --force \
            --no-history \
            --shallow

      - name: Run ANGLE build dependencies
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          if [ -f scripts/install-build-deps.py ]; then
            python3 scripts/install-build-deps.py \
              --no-prompt \
              --no-chromeos-fonts \
              --no-arm \
              || true
          fi

      - name: Run hooks
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          gclient runhooks

      - name: Install Linux host sysroot
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          python3 build/linux/sysroot_scripts/install-sysroot.py \
            --arch=amd64

          test -d build/linux/debian_bullseye_amd64-sysroot

          echo "===== Sysroot installed ====="

          du -sh build/linux/debian_bullseye_amd64-sysroot

      - name: Ensure real GN binary exists
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          mkdir -p angle/buildtools/linux64

          if [ -x angle/buildtools/linux64/gn ]; then
            echo "GN already present"

            angle/buildtools/linux64/gn --version

            exit 0
          fi

          echo "GN missing — installing via CIPD"

          rm -rf /tmp/gn-cipd
          mkdir -p /tmp/gn-cipd

          printf '%s\n' \
            '$VerifiedPlatform linux-amd64' \
            'gn/gn/${platform} latest' \
            > /tmp/gn.ensure

          cipd ensure \
            -root /tmp/gn-cipd \
            -ensure-file /tmp/gn.ensure

          GN_SRC="$(find /tmp/gn-cipd \
            -type f \
            -name gn \
            -perm -111 \
            | head -1)"

          if [ -z "$GN_SRC" ]; then
            echo "Primary GN package not found."
            echo "Trying fallback package..."

            rm -rf /tmp/gn-cipd
            mkdir -p /tmp/gn-cipd

            printf '%s\n' \
              '$VerifiedPlatform linux-amd64' \
              'infra/3pp/tools/gn/${platform} latest' \
              > /tmp/gn.ensure

            cipd ensure \
              -root /tmp/gn-cipd \
              -ensure-file /tmp/gn.ensure

            GN_SRC="$(find /tmp/gn-cipd \
              -type f \
              -name gn \
              -perm -111 \
              | head -1)"
          fi

          test -n "$GN_SRC"

          cp -v \
            "$GN_SRC" \
            angle/buildtools/linux64/gn

          chmod +x angle/buildtools/linux64/gn

          echo "===== Real GN ====="

          ls -lh angle/buildtools/linux64/gn

          file angle/buildtools/linux64/gn

          angle/buildtools/linux64/gn --version

      - name: Verify Android dependencies
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking Android SDK dependency..."

          test -f third_party/android_sdk/BUILD.gn

          echo "Android SDK BUILD.gn found:"

          ls -lh third_party/android_sdk/BUILD.gn

      - name: Verify build tools
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          echo "===== GN wrapper ====="

          command -v gn

          gn --version

          echo "===== Real ANGLE GN ====="

          test -x buildtools/linux64/gn

          buildtools/linux64/gn --version

          echo "===== autoninja ====="

          command -v autoninja

          head -n 5 "$(command -v autoninja)" || true

          echo "===== ninja ====="

          command -v ninja

          ninja --version || true

          echo "Build tools verified successfully"

      - name: Apply BUILD.gn compatibility fix
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f build_overrides/BUILD.gn ]; then
            sed -i \
              's#import("//build_overrides//vulkan_headers.gni")#import("//build_overrides/vulkan_headers.gni")#g' \
              build_overrides/BUILD.gn
          fi

       - name: Generate GN configuration
  working-directory: ${{ github.workspace }}/angle
  shell: bash
  run: |
    set -euxo pipefail

    export PATH="$HOME/depot_tools:$PATH"

    rm -rf out/AndroidArmv8
    mkdir -p out/AndroidArmv8

    cat > out/AndroidArmv8/args.gn <<'EOF'
    target_os = "android"
    target_cpu = "arm64"
    current_cpu = "arm64"

    is_debug = false
    is_component_build = false
    is_official_build = false

    symbol_level = 0

    enable_nacl = false

    use_thin_lto = false
    thin_lto_enable_optimizations = false

    use_remoteexec = false

    is_cfi = false
    arm_control_flow_integrity = "none"

    android_ndk_api_level = 26

    angle_expose_non_conformant_extensions_and_versions = false

    angle_enable_vulkan = true

    angle_enable_gl = false
    angle_enable_d3d11 = false
    angle_enable_metal = false
    angle_enable_swiftshader = false
    angle_enable_null = false
    angle_enable_wgpu = false

    angle_enable_vulkan_validation_layers = false
    angle_enable_vulkan_trace = false

    angle_vulkan_display_mode = "simple"

    angle_libs_suffix = "_angle"

    angle_build_tests = false
    angle_build_samples = false
    angle_build_perftests = false

    use_custom_libcxx = false

    treat_warnings_as_errors = false

    arm_use_neon = true
    arm_optionally_use_neon = false

    extra_cflags = [
      "-march=armv8-a",
      "-mno-outline-atomics",
      "-mno-lse",
    ]

    extra_cxxflags = [
      "-march=armv8-a",
      "-mno-outline-atomics",
      "-mno-lse",
    ]

    extra_asmflags = [
      "-march=armv8-a",
    ]

    extra_ldflags = [
      "-Wl,--mllvm,-aarch64-enable-lse-atomics=false",
    ]
    EOF

    echo "===== args.gn ====="
    cat out/AndroidArmv8/args.gn

    echo "===== Running real GN ====="
    buildtools/linux64/gn gen out/AndroidArmv8

      - name: Diagnose ARMv8 LSE flags
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          echo "========================================"
          echo "GN ARM-RELATED CONFIGURATION"
          echo "========================================"

          buildtools/linux64/gn args out/AndroidArmv8 --list \
            | grep -Ei \
              'arm|aarch64|march|mcpu|mtune|lse|atomic|lto' \
            || true

          echo "========================================"
          echo "GENERATING NINJA COMMAND LIST"
          echo "========================================"

          ninja -C out/AndroidArmv8 -t commands \
            > all-ninja-commands.txt

          echo "========================================"
          echo "ARM/LSE FLAGS FOUND IN NINJA"
          echo "========================================"

          grep -Ei \
            -- '-march=|-mcpu=|-mtune=|-m(no-)?lse|-moutline-atomics|\+lse|-target-feature' \
            all-ninja-commands.txt \
            | head -200 \
            || true

          echo "========================================"
          echo "GLES2-SPECIFIC COMMANDS"
          echo "========================================"

          grep -Ei \
            'libGLESv2|GLESv2' \
            all-ninja-commands.txt \
            | grep -Ei \
              -- '-march=|-mcpu=|-mtune=|-m(no-)?lse|-moutline-atomics|\+lse|-target-feature' \
            | head -100 \
            || true

          echo "========================================"
          echo "SEARCHING GENERATED NINJA FILES"
          echo "========================================"

          grep -RniE \
            '(\+lse|-march=armv8\.1|-march=armv8\.2|-mcpu=.*lse|-moutline-atomics)' \
            out/AndroidArmv8 \
            --include='*.ninja' \
            --include='*.rsp' \
            2>/dev/null \
            | head -200 \
            || true

      - name: Discover Ninja targets
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          ninja -C out/AndroidArmv8 -t targets \
            > ninja-targets.txt

          echo "===== ANGLE targets ====="

          grep -E \
            '(^|/)(libEGL|libGLESv2|libGLESv1_CM)(\.so|\.a)?' \
            ninja-targets.txt \
            || true

      - name: Build shared libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          autoninja -C out/AndroidArmv8 \
            libEGL \
            libGLESv2 \
            libGLESv1_CM

      - name: Discover static targets
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          ninja -C out/AndroidArmv8 -t targets \
            | grep -E '\.a($| )' \
            | sort -u \
            > static-targets.txt \
            || true

          echo "===== Static targets ====="

          cat static-targets.txt || true

      - name: Build static libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          if [ -s static-targets.txt ]; then
            while read -r target; do
              [ -z "$target" ] && continue

              echo "Building static target: $target"

              autoninja \
                -C out/AndroidArmv8 \
                "$target"

            done < static-targets.txt
          else
            echo "No static library targets discovered."
          fi

          set -Eeuo pipefail

        - name: Post-link LSE guard
  working-directory: ${{ github.workspace }}/angle
  shell: bash
  run: |
    set -euxo pipefail

    OBJDUMP="$(find third_party/llvm-build -type f -name llvm-objdump -perm -111 | head -1)"

    for lib in \
      out/AndroidArmv8/libEGL_angle.so \
      out/AndroidArmv8/libGLESv2_angle.so \
      out/AndroidArmv8/libGLESv1_CM_angle.so; do

      echo "Checking $lib..."

      "$OBJDUMP" -d "$lib" > /tmp/check.asm

      if grep -Eiq \
        '\b(ldadd|ldclr|ldeor|ldset|swp[a-z]*|casp?[a-z]*|stadd|stclr|steor|stset)\b' \
        /tmp/check.asm; then
        echo "ERRO: LSE detectado em $lib"
        grep -Ei \
          '\b(ldadd|ldclr|ldeor|ldset|swp[a-z]*|casp?[a-z]*|stadd|stclr|steor|stset)\b' \
          /tmp/check.asm | head -20
        exit 1
      fi

      echo "OK: $lib sem LSE"
    done

      - name: Inspect ANGLE build outputs
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== All shared libraries ====="

          find out/AndroidArmv8 \
            -type f \
            -name '*.so' \
            -print \
            | sort

          echo "===== All static libraries ====="

          find out/AndroidArmv8 \
            -type f \
            -name '*.a' \
            -print \
            | sort

          echo "===== All ANGLE-related outputs ====="

          find out/AndroidArmv8 \
            -type f \
            \( \
              -iname '*egl*' \
              -o -iname '*gles*' \
              -o -iname '*angle*' \
            \) \
            -print \
            | sort

      - name: Inspect Ninja targets
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          echo "===== Relevant Ninja targets ====="

          ninja -C out/AndroidArmv8 -t targets \
            | grep -Ei \
              'egl|gles|angle|lib' \
            | head -300 \
            || true

      - name: Collect libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf package

          mkdir -p \
            package/lib \
            package/include

          echo "===== Collecting ANGLE shared libraries ====="

          cp -v \
            out/AndroidArmv8/libEGL_angle.so \
            package/lib/

          cp -v \
            out/AndroidArmv8/libGLESv2_angle.so \
            package/lib/

          cp -v \
            out/AndroidArmv8/libGLESv1_CM_angle.so \
            package/lib/

          echo "===== Collecting headers ====="

          if [ -d include ]; then
            cp -r include/* package/include/ || true
          fi

          echo "===== Package contents ====="

          find package \
            -type f \
            -print \
            | sort

          echo "===== Shared libraries ====="

          ls -lh package/lib/*.so

      - name: Locate ARMv8.1 LSE instructions
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          OBJDUMP=""

          if command -v llvm-objdump >/dev/null 2>&1; then
            OBJDUMP="$(command -v llvm-objdump)"
          fi

          if [ -z "$OBJDUMP" ]; then
            OBJDUMP="$(
              find third_party/llvm-build \
                -type f \
                -name llvm-objdump \
                -perm -111 \
                2>/dev/null \
                | head -1 \
                || true
            )"
          fi

          test -n "$OBJDUMP"
          test -x "$OBJDUMP"

          echo "========================================"
          echo "LLVM OBJDUMP"
          echo "========================================"

          echo "$OBJDUMP"
          "$OBJDUMP" --version | head -5

          echo "========================================"
          echo "LSE INSTRUCTIONS IN FINAL GLESv2"
          echo "========================================"

          "$OBJDUMP" -d \
            package/lib/libGLESv2_angle.so \
            > /tmp/libGLESv2_angle.asm

          grep -Ein \
            '\b(ldadd|ldclr|ldeor|ldset|swp|casp|cas[a-z]*|stadd|stclr|steor|stset)\b' \
            /tmp/libGLESv2_angle.asm \
            | head -100 \
            || true

          echo "========================================"
          echo "DISASSEMBLY CONTEXT"
          echo "========================================"

          grep -Ein \
            -B8 \
            -A8 \
            '\b(ldadd|ldclr|ldeor|ldset|swp|casp|cas[a-z]*|stadd|stclr|steor|stset)\b' \
            /tmp/libGLESv2_angle.asm \
            | head -300 \
            || true

          echo "========================================"
          echo "SEARCHING OBJECT FILES"
          echo "========================================"

          find out/AndroidArmv8 \
            -type f \
            \( -name '*.o' -o -name '*.obj' \) \
            -print \
            > /tmp/angle-objects.txt

          echo "Object count:"
          wc -l /tmp/angle-objects.txt

          FOUND=0

          while IFS= read -r obj; do
            [ -f "$obj" ] || continue

            if "$OBJDUMP" -d "$obj" 2>/dev/null \
              | grep -Eiq \
              '\b(ldadd|ldclr|ldeor|ldset|swp|casp|cas[a-z]*|stadd|stclr|steor|stset)\b'; then

              echo
              echo "========================================"
              echo "LSE FOUND IN OBJECT"
              echo "========================================"
              echo "$obj"

              "$OBJDUMP" -d "$obj" 2>/dev/null \
                | grep -Ei \
                  '\b(ldadd|ldclr|ldeor|ldset|swp|casp|cas[a-z]*|stadd|stclr|steor|stset)\b' \
                | head -30

              FOUND=1
            fi

          done < /tmp/angle-objects.txt

          echo
          echo "========================================"
          echo "RESULT"
          echo "========================================"

          if [ "$FOUND" -eq 0 ]; then
            echo "No individual object with LSE instructions was found."
            echo "LSE may have been introduced during LTO/link-time optimization."
          else
            echo "One or more object files contain LSE instructions."
          fi

      - name: Verify ARM64 binaries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          find package/lib \
            -type f \
            \( -name '*.so' -o -name '*.a' \) \
            -print

          for file in package/lib/*.so; do
            [ -f "$file" ] || continue

            echo "===== $file ====="

            file "$file"

            readelf -h "$file" | grep -E \
              'Class:|Machine:'

            readelf -h "$file" | grep -q \
              'Machine:.*AArch64'
          done

      - name: Check ARMv8.0 compatibility
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          OBJDUMP=""

          if command -v llvm-objdump >/dev/null 2>&1; then
            OBJDUMP="$(command -v llvm-objdump)"
          fi

          if [ -z "$OBJDUMP" ]; then
            OBJDUMP="$(
              find third_party/llvm-build \
                -type f \
                -name llvm-objdump \
                -perm -111 \
                2>/dev/null \
                | head -1 \
                || true
            )"
          fi

          if [ -z "$OBJDUMP" ] || [ ! -x "$OBJDUMP" ]; then
            echo "llvm-objdump not found."
            echo "ARM instruction scan skipped."
            exit 0
          fi

          echo "Using objdump: $OBJDUMP"

          for file in package/lib/*.so; do
            [ -f "$file" ] || continue

            echo "========================================"
            echo "Checking: $file"
            echo "========================================"

            "$OBJDUMP" -d "$file" \
              > "${file}.asm"

            if grep -Eiq \
              '\b(ldadd|ldclr|ldeor|ldset|swp|casp|cas[a-z]*|stadd|stclr|steor|stset)\b' \
              "${file}.asm"; then

              echo
              echo "ERROR: ARM LSE instruction detected:"
              echo

              grep -Ei \
                '\b(ldadd|ldclr|ldeor|ldset|swp|casp|cas[a-z]*|stadd|stclr|steor|stset)\b' \
                "${file}.asm" \
                | head -50

              echo
              echo "This library is not restricted to an ARMv8.0-A baseline."
              echo

              exit 1
            fi

            rm -f "${file}.asm"

            echo "OK: $file"
          done

      - name: Package
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          cd package

          zip -9 -r \
            ../ANGLE-Android-ARMv8.0.zip \
            .

          cd ..

          ls -lh ANGLE-Android-ARMv8.0.zip

      - name: Upload ANGLE package
        uses: actions/upload-artifact@v4
        with:
          name: ANGLE-Android-ARMv8.0
          path: angle/ANGLE-Android-ARMv8.0.zip
          if-no-files-found: error
