name: ANGLE Android ARMv8.0 - Shared and Static Libraries

on:
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout ANGLE
        uses: actions/checkout@v4
        with:
          path: angle

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            curl \
            wget \
            unzip \
            zip \
            xz-utils \
            bzip2 \
            ninja-build \
            clang \
            lld \
            build-essential \
            pkg-config \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxdamage-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            mesa-common-dev \
            libwayland-dev \
            wayland-protocols \
            libwayland-egl-backend-dev \
            libvulkan-dev \
            vulkan-tools \
            libudev-dev \
            libpulse-dev \
            libasound2-dev \
            libnss3-dev \
            libnspr4-dev \
            libgtk-3-dev \
            ccache

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          ccache --version

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: angle-android-arm64-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            angle-android-arm64-ccache-${{ runner.os }}-

      - name: Bootstrap depot_tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$HOME/depot_tools"

          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"

          export PATH="$HOME/depot_tools:$PATH"

          "$HOME/depot_tools/ensure_bootstrap"

          command -v gn
          command -v autoninja
          command -v ninja

      - name: Create .gclient
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "angle",
              "url": "https://chromium.googlesource.com/angle/angle.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          EOF

      - name: Sync dependencies
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          gclient sync \
            --no-history \
            --shallow \
            --nohooks

      - name: Run ANGLE build dependencies
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          python3 scripts/install-build-deps.py \
            --no-prompt \
            --no-chromeos-fonts \
            --no-arm \
            --no-prompt || true

      - name: Run hooks
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          gclient runhooks

      - name: Verify build tools
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          "$HOME/depot_tools/ensure_bootstrap"

          echo "GN:"
          command -v gn
          gn --version

          echo "autoninja:"
          command -v autoninja
          head -n 5 "$(command -v autoninja)" || true

          echo "ninja:"
          command -v ninja
          ninja --help >/dev/null

          echo "Build tools verified successfully"

      - name: Apply BUILD.gn compatibility fix
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f build_overrides/BUILD.gn ]; then
            sed -i \
              's#import("//build_overrides//vulkan_headers.gni")#import("//build_overrides/vulkan_headers.gni")#g' \
              build_overrides/BUILD.gn
          fi

      - name: Generate GN configuration
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          mkdir -p out/AndroidArmv8

          cat > out/AndroidArmv8/args.gn <<'EOF'
          target_os = "android"
          target_cpu = "arm64"
          current_cpu = "arm64"

          is_debug = false
          is_component_build = false
          is_official_build = true

          symbol_level = 0

          enable_nacl = false
          use_thin_lto = false
          use_remoteexec = false

          is_cfi = false
          arm_control_flow_integrity = "none"

          android_ndk_api_level = 26

          angle_expose_non_conformant_extensions_and_versions = false

          angle_enable_vulkan = true

          angle_enable_gl = false
          angle_enable_d3d11 = false
          angle_enable_metal = false
          angle_enable_swiftshader = false
          angle_enable_null = false
          angle_enable_wgpu = false

          angle_enable_vulkan_validation_layers = false
          angle_enable_vulkan_trace = false

          angle_vulkan_display_mode = "simple"

          angle_libs_suffix = "_angle"

          angle_build_tests = false
          angle_build_samples = false
          angle_build_perftests = false

          use_custom_libcxx = false

          treat_warnings_as_errors = false

          extra_cflags = [
            "-march=armv8-a",
            "-mtune=generic",
            "-mno-outline-atomics",
          ]

          extra_cxxflags = [
            "-march=armv8-a",
            "-mtune=generic",
            "-mno-outline-atomics",
          ]

          extra_asmflags = [
            "-march=armv8-a",
          ]
          EOF

          gn gen out/AndroidArmv8

      - name: Discover Ninja targets
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          ninja -C out/AndroidArmv8 -t targets > ninja-targets.txt

          grep -E '(^|/)(libEGL|libGLESv2|libGLESv1_CM)(\.so|\.a)?' \
            ninja-targets.txt || true

      - name: Build shared libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          autoninja -C out/AndroidArmv8 \
            libEGL \
            libGLESv2 \
            libGLESv1_CM

      - name: Discover static targets
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          ninja -C out/AndroidArmv8 -t targets \
            | grep -E '\.a($| )' \
            | sort -u \
            > static-targets.txt || true

          cat static-targets.txt || true

      - name: Build static libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          if [ -s static-targets.txt ]; then
            while read -r target; do
              [ -z "$target" ] && continue

              autoninja -C out/AndroidArmv8 "$target"
            done < static-targets.txt
          else
            echo "No static library targets discovered."
          fi

      - name: Collect libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf package
          mkdir -p package/lib package/include

          find out/AndroidArmv8 \
            -type f \
            \( \
              -name 'libEGL.so' \
              -o -name 'libGLESv2.so' \
              -o -name 'libGLESv1_CM.so' \
              -o -name 'libEGL.a' \
              -o -name 'libGLESv2.a' \
              -o -name 'libGLESv1_CM.a' \
            \) \
            -exec cp -v {} package/lib/ \;

          if [ -d include ]; then
            cp -r include/* package/include/ || true
          fi

          find package -type f -print

      - name: Verify ARM64 binaries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          find package/lib -type f \
            \( -name '*.so' -o -name '*.a' \) \
            -print

          for file in package/lib/*.so; do
            [ -f "$file" ] || continue

            file "$file"

            readelf -h "$file" | grep -E \
              'Class:|Machine:'
          done

      - name: Check ARMv8.0 compatibility
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v llvm-objdump >/dev/null 2>&1; then
            echo "llvm-objdump not found, skipping instruction scan."
            exit 0
          fi

          for file in package/lib/*.so; do
            [ -f "$file" ] || continue

            echo "Checking: $file"

            llvm-objdump -d "$file" > "${file}.asm"

            if grep -E \
              'ldadd|ldclr|ldeor|ldset|swp|cas[a-z]*|casp[a-z]*|sve|bfmmla|fmlall' \
              "${file}.asm"; then

              echo "Unsupported ARMv8.0+ instruction pattern detected in $file"
              exit 1
            fi
          done

      - name: Package
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          cd package

          zip -r \
            ../ANGLE-Android-ARMv8.0.zip \
            .

      - name: Upload ANGLE package
        uses: actions/upload-artifact@v4
        with:
          name: ANGLE-Android-ARMv8.0
          path: angle/ANGLE-Android-ARMv8.0.zip
          if-no-files-found: error
