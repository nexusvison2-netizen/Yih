name: ANGLE Android ARMv8.0 - Shared Libraries

on:
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      ANGLE_DIR: ${{ github.workspace }}/angle
      OUT_DIR: ${{ github.workspace }}/angle/out/AndroidArmv8

    steps:
      - name: Checkout ANGLE
        uses: actions/checkout@v4
        with:
          path: angle
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            curl \
            wget \
            unzip \
            zip \
            xz-utils \
            bzip2 \
            ninja-build \
            clang \
            lld \
            build-essential \
            pkg-config \
            file \
            binutils \
            ccache \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxdamage-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            mesa-common-dev \
            libwayland-dev \
            wayland-protocols \
            libwayland-egl-backend-dev \
            libvulkan-dev \
            vulkan-tools \
            libudev-dev \
            libpulse-dev \
            libasound2-dev \
            libnss3-dev \
            libnspr4-dev \
            libgtk-3-dev

      - name: Bootstrap depot_tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$HOME/depot_tools"

          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

          "$HOME/depot_tools/ensure_bootstrap"

          command -v gclient
          command -v cipd
          command -v gn
          command -v autoninja
          command -v ninja

      - name: Create .gclient
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "angle",
              "url": "https://chromium.googlesource.com/angle/angle.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]

          target_os = ["android"]
          target_os_only = True
          EOF

          cat .gclient

      - name: Sync dependencies
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          gclient sync \
            --force \
            --no-history \
            --shallow

      - name: Run hooks
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          gclient runhooks

      - name: Install Linux host sysroot
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          python3 build/linux/sysroot_scripts/install-sysroot.py \
            --arch=amd64

          test -d build/linux/debian_bullseye_amd64-sysroot

      - name: Ensure GN binary exists
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p angle/buildtools/linux64

          if [ -x angle/buildtools/linux64/gn ]; then
            angle/buildtools/linux64/gn --version
            exit 0
          fi

          rm -rf /tmp/gn-cipd
          mkdir -p /tmp/gn-cipd

          printf '%s\n' \
            '$VerifiedPlatform linux-amd64' \
            'gn/gn/${platform} latest' \
            > /tmp/gn.ensure

          cipd ensure \
            -root /tmp/gn-cipd \
            -ensure-file /tmp/gn.ensure

          GN_SRC="$(
            find /tmp/gn-cipd \
              -type f \
              -name gn \
              -perm -111 \
              | head -1
          )"

          if [ -z "$GN_SRC" ]; then
            rm -rf /tmp/gn-cipd
            mkdir -p /tmp/gn-cipd

            printf '%s\n' \
              '$VerifiedPlatform linux-amd64' \
              'infra/3pp/tools/gn/${platform} latest' \
              > /tmp/gn.ensure

            cipd ensure \
              -root /tmp/gn-cipd \
              -ensure-file /tmp/gn.ensure

            GN_SRC="$(
              find /tmp/gn-cipd \
                -type f \
                -name gn \
                -perm -111 \
                | head -1
            )"
          fi

          test -n "$GN_SRC"

          cp -v "$GN_SRC" angle/buildtools/linux64/gn
          chmod +x angle/buildtools/linux64/gn

          angle/buildtools/linux64/gn --version

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          ccache --version
          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: angle-android-arm64-armv80-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            angle-android-arm64-armv80-${{ runner.os }}-

      - name: Generate ARMv8.0 GN configuration
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf out/AndroidArmv8
          mkdir -p out/AndroidArmv8

          cat > out/AndroidArmv8/args.gn <<'EOF'
          target_os = "android"
          target_cpu = "arm64"
          current_cpu = "arm64"

          is_debug = false
          is_component_build = false
          is_official_build = false
          symbol_level = 0

          enable_nacl = false
          use_remoteexec = false
          clang_use_chrome_plugins = false

          use_thin_lto = false
          use_lto = false
          lto_unit_merging = false
          thin_lto_enable_optimizations = false

          is_cfi = false
          arm_control_flow_integrity = "none"

          android_ndk_api_level = 26

          arm_arch = "armv8-a"
          arm_tune = "generic"
          arm_use_neon = true
          arm_optionally_use_neon = false
          arm_use_crc = false
          arm_use_lse = false

          angle_expose_non_conformant_extensions_and_versions = false

          angle_enable_vulkan = true
          angle_enable_gl = false
          angle_enable_d3d11 = false
          angle_enable_metal = false
          angle_enable_swiftshader = false
          angle_enable_null = false
          angle_enable_wgpu = false
          angle_enable_cl = false
          angle_enable_cl_passthrough = false

          angle_enable_vulkan_validation_layers = false
          angle_enable_vulkan_api_dump_layer = false
          angle_enable_vulkan_trace = false
          angle_debug_layers_enabled = false
          angle_vulkan_display_mode = "simple"

          angle_libs_suffix = "_angle"

          angle_build_tests = false
          angle_build_samples = false
          angle_build_perftests = false

          use_custom_libcxx = false
          treat_warnings_as_errors = false

          angle_enable_trace = false
          angle_enable_trace_android_logcat = false
          angle_enable_trace_events = false
          angle_enable_memory_alloc_logging = false
          angle_enable_unwind_backtrace_support = false

          checkout_angle_partition_alloc = false
          angle_use_partition_alloc = false

          # ARMv8.0-A only.
          # +nocrc explicitly prevents CRC instructions.
          extra_cflags = [
            "-march=armv8-a+nocrc",
            "-mtune=generic",
            "-mno-outline-atomics",
            "-mno-crc",
            "-mno-fp16",
            "-mno-dotprod",
            "-mno-sve",
            "-mno-sve2",
            "-mno-i8mm",
            "-mno-bf16",
            "-Wno-error",
          ]

          extra_cxxflags = [
            "-march=armv8-a+nocrc",
            "-mtune=generic",
            "-mno-outline-atomics",
            "-mno-crc",
            "-mno-fp16",
            "-mno-dotprod",
            "-mno-sve",
            "-mno-sve2",
            "-mno-i8mm",
            "-mno-bf16",
            "-Wno-error",
          ]

          extra_asmflags = [
            "-march=armv8-a+nocrc",
            "-mno-crc",
          ]
          EOF

          cat out/AndroidArmv8/args.gn

          buildtools/linux64/gn gen out/AndroidArmv8

      - name: Verify generated compiler flags
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          ninja -C out/AndroidArmv8 -t commands \
            > /tmp/ninja-commands.txt

          if grep -nE \
            -- \
            '\+lse|\+crc|-march=armv(8\.[1-9]|9)|-mcpu=[^ ]*(native|armv8\.[1-9]|armv9)|-moutline-atomics' \
            /tmp/ninja-commands.txt \
            | head -50; then
            echo "Forbidden ARMv8.1+ compiler flags found."
            exit 1
          fi

          echo "No forbidden ARM compiler flags found."

      - name: Build shared libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          # Disable ccache for the first clean validation run.
          CCACHE_DISABLE=1 autoninja -C out/AndroidArmv8 \
            libEGL \
            libGLESv2 \
            libGLESv1_CM

      - name: Locate llvm-objdump
        id: llvm
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          OBJDUMP="$(
            find third_party/llvm-build \
              -type f \
              -name llvm-objdump \
              -perm -111 \
              | head -1
          )"

          test -n "$OBJDUMP"
          test -x "$OBJDUMP"

          echo "path=$OBJDUMP" >> "$GITHUB_OUTPUT"

      - name: Validate ARMv8.0 shared libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        env:
          OBJDUMP: ${{ steps.llvm.outputs.path }}
        run: |
          set -euo pipefail

          FAILED=0

          check_library() {
            local lib="$1"

            echo
            echo "========================================"
            echo "Checking: $lib"
            echo "========================================"

            if [ ! -f "$lib" ]; then
              echo "Missing library: $lib"
              FAILED=1
              return
            fi

            file "$lib"

            if ! file "$lib" | grep -Eq \
              'ELF 64-bit LSB shared object, ARM aarch64'; then
              echo "Invalid ARM64 shared library: $lib"
              FAILED=1
              return
            fi

            if ! readelf -h "$lib" | grep -q 'Class:.*ELF64'; then
              echo "Library is not ELF64: $lib"
              FAILED=1
              return
            fi

            if ! readelf -h "$lib" | grep -q 'Machine:.*AArch64'; then
              echo "Library is not AArch64: $lib"
              FAILED=1
              return
            fi

            local asm_file="/tmp/$(basename "$lib").asm"

            "$OBJDUMP" \
              --arch-name=aarch64 \
              -d "$lib" \
              > "$asm_file"

            local hits
            hits="$(
              grep -Ein \
                '\b(ldadd[a-z]*|ldclr[a-z]*|ldeor[a-z]*|ldset[a-z]*|swp[a-z]*|casp[a-z]*|stadd[a-z]*|stclr[a-z]*|steor[a-z]*|stset[a-z]*|crc32[bwhx]|crc32c[bwhx]|sdot|udot|fcmla|fmlal|fmlsl|bfmml|fmlal2|fmlsl2)\b' \
                "$asm_file" \
                | head -50 || true
            )"

            if [ -n "$hits" ]; then
              echo
              echo "Forbidden ARMv8.1+ instructions found in $lib:"
              printf '%s\n' "$hits"

              echo
              echo "Disassembly context:"
              grep -Ein -C 3 \
                '\b(ldadd[a-z]*|ldclr[a-z]*|ldeor[a-z]*|ldset[a-z]*|swp[a-z]*|casp[a-z]*|stadd[a-z]*|stclr[a-z]*|steor[a-z]*|stset[a-z]*|crc32[bwhx]|crc32c[bwhx]|sdot|udot|fcmla|fmlal|fmlsl|bfmml|fmlal2|fmlsl2)\b' \
                "$asm_file" \
                | head -100 || true

              FAILED=1
            else
              echo "ARMv8.0-only: $lib"
            fi

            rm -f "$asm_file"
          }

          check_library out/AndroidArmv8/libEGL_angle.so
          check_library out/AndroidArmv8/libGLESv2_angle.so
          check_library out/AndroidArmv8/libGLESv1_CM_angle.so

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "One or more ARM64 libraries failed ARMv8.0 validation."
            exit 1
          fi

          echo
          echo "All shared libraries passed ARMv8.0 validation."

      - name: Collect libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf package
          mkdir -p package/lib
          mkdir -p package/include

          cp -v \
            out/AndroidArmv8/libEGL_angle.so \
            package/lib/

          cp -v \
            out/AndroidArmv8/libGLESv2_angle.so \
            package/lib/

          cp -v \
            out/AndroidArmv8/libGLESv1_CM_angle.so \
            package/lib/

          if [ -d include ]; then
            cp -r include/* package/include/ || true
          fi

          find package -type f -print | sort
          ls -lh package/lib

      - name: Package
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          cd package
          zip -9 -r ../ANGLE-Android-ARMv8.0.zip .
          cd ..

          ls -lh ANGLE-Android-ARMv8.0.zip

      - name: Upload ANGLE package
        uses: actions/upload-artifact@v4
        with:
          name: ANGLE-Android-ARMv8.0
          path: angle/ANGLE-Android-ARMv8.0.zip
          if-no-files-found: error
