name: ANGLE Android ARMv8.0 - Shared and Static Libraries

on:
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout ANGLE
        uses: actions/checkout@v4
        with:
          path: angle
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            curl \
            wget \
            unzip \
            zip \
            xz-utils \
            bzip2 \
            ninja-build \
            clang \
            lld \
            build-essential \
            pkg-config \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxdamage-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            mesa-common-dev \
            libwayland-dev \
            wayland-protocols \
            libwayland-egl-backend-dev \
            libvulkan-dev \
            vulkan-tools \
            libudev-dev \
            libpulse-dev \
            libasound2-dev \
            libnss3-dev \
            libnspr4-dev \
            libgtk-3-dev \
            ccache

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          ccache --version

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: angle-android-arm64-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            angle-android-arm64-ccache-${{ runner.os }}-

      - name: Bootstrap depot_tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$HOME/depot_tools"

          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"

          export PATH="$HOME/depot_tools:$PATH"

          "$HOME/depot_tools/ensure_bootstrap"

          command -v gclient
          command -v cipd
          command -v gn
          command -v autoninja
          command -v ninja

      - name: Create .gclient
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "angle",
              "url": "https://chromium.googlesource.com/angle/angle.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]

          target_os = ["android"]
          target_os_only = True
          EOF

          echo "===== .gclient ====="
          cat .gclient

      - name: Sync dependencies
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          gclient sync \
            --force \
            --no-history \
            --shallow

      - name: Run ANGLE build dependencies
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          if [ -f scripts/install-build-deps.py ]; then
            python3 scripts/install-build-deps.py \
              --no-prompt \
              --no-chromeos-fonts \
              --no-arm \
              || true
          fi

      - name: Run hooks
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          gclient runhooks

      - name: Install Linux host sysroot
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          python3 build/linux/sysroot_scripts/install-sysroot.py \
            --arch=amd64

          test -d build/linux/debian_bullseye_amd64-sysroot

          echo "===== Sysroot installed ====="

          du -sh build/linux/debian_bullseye_amd64-sysroot

      - name: Ensure real GN binary exists
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          mkdir -p angle/buildtools/linux64

          if [ -x angle/buildtools/linux64/gn ]; then
            echo "GN already present"

            angle/buildtools/linux64/gn --version

            exit 0
          fi

          echo "GN missing — installing via CIPD"

          rm -rf /tmp/gn-cipd
          mkdir -p /tmp/gn-cipd

          printf '%s\n' \
            '$VerifiedPlatform linux-amd64' \
            'gn/gn/${platform} latest' \
            > /tmp/gn.ensure

          cipd ensure \
            -root /tmp/gn-cipd \
            -ensure-file /tmp/gn.ensure

          GN_SRC="$(find /tmp/gn-cipd \
            -type f \
            -name gn \
            -perm -111 \
            | head -1)"

          if [ -z "$GN_SRC" ]; then
            echo "Primary GN package not found."
            echo "Trying fallback package..."

            rm -rf /tmp/gn-cipd
            mkdir -p /tmp/gn-cipd

            printf '%s\n' \
              '$VerifiedPlatform linux-amd64' \
              'infra/3pp/tools/gn/${platform} latest' \
              > /tmp/gn.ensure

            cipd ensure \
              -root /tmp/gn-cipd \
              -ensure-file /tmp/gn.ensure

            GN_SRC="$(find /tmp/gn-cipd \
              -type f \
              -name gn \
              -perm -111 \
              | head -1)"
          fi

          test -n "$GN_SRC"

          cp -v \
            "$GN_SRC" \
            angle/buildtools/linux64/gn

          chmod +x angle/buildtools/linux64/gn

          echo "===== Real GN ====="

          ls -lh angle/buildtools/linux64/gn

          file angle/buildtools/linux64/gn

          angle/buildtools/linux64/gn --version

      - name: Verify Android dependencies
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking Android SDK dependency..."

          test -f third_party/android_sdk/BUILD.gn

          echo "Android SDK BUILD.gn found:"

          ls -lh third_party/android_sdk/BUILD.gn

      - name: Verify build tools
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          echo "===== GN wrapper ====="

          command -v gn

          gn --version

          echo "===== Real ANGLE GN ====="

          test -x buildtools/linux64/gn

          buildtools/linux64/gn --version

          echo "===== autoninja ====="

          command -v autoninja

          head -n 5 "$(command -v autoninja)" || true

          echo "===== ninja ====="

          command -v ninja

          ninja --version || true

          echo "Build tools verified successfully"

      - name: Apply BUILD.gn compatibility fix
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f build_overrides/BUILD.gn ]; then
            sed -i \
              's#import("//build_overrides//vulkan_headers.gni")#import("//build_overrides/vulkan_headers.gni")#g' \
              build_overrides/BUILD.gn
          fi

      - name: Generate GN configuration
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          mkdir -p out/AndroidArmv8

          cat > out/AndroidArmv8/args.gn <<'EOF'
          target_os = "android"
          target_cpu = "arm64"
          current_cpu = "arm64"

          is_debug = false
          is_component_build = false
          is_official_build = false

          symbol_level = 0

          enable_nacl = false

          use_thin_lto = true
          thin_lto_enable_optimizations = true

          use_remoteexec = false

          is_cfi = false
          arm_control_flow_integrity = "none"

          android_ndk_api_level = 26

          angle_expose_non_conformant_extensions_and_versions = false

          angle_enable_vulkan = true

          angle_enable_gl = false
          angle_enable_d3d11 = false
          angle_enable_metal = false
          angle_enable_swiftshader = false
          angle_enable_null = false
          angle_enable_wgpu = false

          angle_enable_vulkan_validation_layers = false
          angle_enable_vulkan_trace = false

          angle_vulkan_display_mode = "simple"

          angle_libs_suffix = "_angle"

          angle_build_tests = false
          angle_build_samples = false
          angle_build_perftests = false

          use_custom_libcxx = false

          treat_warnings_as_errors = false

          extra_cflags = [
            "-march=armv8-a",
            "-mtune=generic",
            "-mno-outline-atomics",
          ]

          extra_cxxflags = [
            "-march=armv8-a",
            "-mtune=generic",
            "-mno-outline-atomics",
          ]

          extra_asmflags = [
            "-march=armv8-a",
          ]
          EOF

          echo "===== args.gn ====="

          cat out/AndroidArmv8/args.gn

          echo "===== Running real GN ====="

          buildtools/linux64/gn gen out/AndroidArmv8

      - name: Discover Ninja targets
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          ninja -C out/AndroidArmv8 -t targets \
            > ninja-targets.txt

          echo "===== ANGLE targets ====="

          grep -E \
            '(^|/)(libEGL|libGLESv2|libGLESv1_CM)(\.so|\.a)?' \
            ninja-targets.txt \
            || true

      - name: Build shared libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          autoninja -C out/AndroidArmv8 \
            libEGL \
            libGLESv2 \
            libGLESv1_CM

      - name: Discover static targets
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          ninja -C out/AndroidArmv8 -t targets \
            | grep -E '\.a($| )' \
            | sort -u \
            > static-targets.txt \
            || true

          echo "===== Static targets ====="

          cat static-targets.txt || true

      - name: Build static libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          if [ -s static-targets.txt ]; then
            while read -r target; do
              [ -z "$target" ] && continue

              echo "Building static target: $target"

              autoninja \
                -C out/AndroidArmv8 \
                "$target"

            done < static-targets.txt
          else
            echo "No static library targets discovered."
          fi

      - name: Inspect ANGLE build outputs
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== All shared libraries ====="

          find out/AndroidArmv8 \
            -type f \
            -name '*.so' \
            -print \
            | sort

          echo "===== All static libraries ====="

          find out/AndroidArmv8 \
            -type f \
            -name '*.a' \
            -print \
            | sort

          echo "===== All ANGLE-related outputs ====="

          find out/AndroidArmv8 \
            -type f \
            \( \
              -iname '*egl*' \
              -o -iname '*gles*' \
              -o -iname '*angle*' \
            \) \
            -print \
            | sort

      - name: Inspect Ninja targets
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          echo "===== Relevant Ninja targets ====="

          ninja -C out/AndroidArmv8 -t targets \
            | grep -Ei \
              'egl|gles|angle|lib' \
            | head -300 \
            || true

      - name: Collect libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf package

          mkdir -p \
            package/lib \
            package/include

          echo "===== Collecting ANGLE shared libraries ====="

          cp -v \
            out/AndroidArmv8/libEGL_angle.so \
            package/lib/

          cp -v \
            out/AndroidArmv8/libGLESv2_angle.so \
            package/lib/

          cp -v \
            out/AndroidArmv8/libGLESv1_CM_angle.so \
            package/lib/

          echo "===== Collecting headers ====="

          if [ -d include ]; then
            cp -r include/* package/include/ || true
          fi

          echo "===== Package contents ====="

          find package \
            -type f \
            -print \
            | sort

          echo "===== Shared libraries ====="

          ls -lh package/lib/*.so

      - name: Verify ARM64 binaries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          find package/lib \
            -type f \
            \( -name '*.so' -o -name '*.a' \) \
            -print

          for file in package/lib/*.so; do
            [ -f "$file" ] || continue

            echo "===== $file ====="

            file "$file"

            readelf -h "$file" | grep -E \
              'Class:|Machine:'

            readelf -h "$file" | grep -q \
              'Machine:.*AArch64'
          done

      - name: Check ARMv8.0 compatibility
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          OBJDUMP=""

          if command -v llvm-objdump >/dev/null 2>&1; then
            OBJDUMP="$(command -v llvm-objdump)"
          fi

          if [ -z "$OBJDUMP" ]; then
            OBJDUMP="$(
              find third_party/llvm-build \
                -type f \
                -name llvm-objdump \
                -perm -111 \
                2>/dev/null \
                | head -1 \
                || true
            )"
          fi

          if [ -z "$OBJDUMP" ] || [ ! -x "$OBJDUMP" ]; then
            echo "llvm-objdump not found."

            echo "ARM instruction scan skipped."

            exit 0
          fi

          echo "Using objdump: $OBJDUMP"

          for file in package/lib/*.so; do
            [ -f "$file" ] || continue

            echo "Checking: $file"

            "$OBJDUMP" -d "$file" \
              > "${file}.asm"

            if grep -Eiq \
              '\b(ldadd|ldclr|ldeor|ldset|swp|casp|cas[a-z]*|stadd|stclr|steor|stset|crc32|crc32c|fcmla|fmlal|sdot|udot|bfmmla|sve)\b' \
              "${file}.asm"; then

              echo "ERROR: ARMv8.1+ instruction detected in $file"

              grep -Eiq \
                '\b(ldadd|ldclr|ldeor|ldset|swp|casp|cas[a-z]*|stadd|stclr|steor|stset|crc32|crc32c|fcmla|fmlal|sdot|udot|bfmmla|sve)\b' \
                "${file}.asm" \
                || true

              grep -Ei \
                '\b(ldadd|ldclr|ldeor|ldset|swp|casp|cas[a-z]*|stadd|stclr|steor|stset|crc32|crc32c|fcmla|fmlal|sdot|udot|bfmmla|sve)\b' \
                "${file}.asm" \
                | head -20

              exit 1
            fi

            rm -f "${file}.asm"

            echo "OK: $file"
          done

      - name: Package
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          cd package

          zip -9 -r \
            ../ANGLE-Android-ARMv8.0.zip \
            .

          cd ..

          ls -lh ANGLE-Android-ARMv8.0.zip

      - name: Upload ANGLE package
        uses: actions/upload-artifact@v4
        with:
          name: ANGLE-Android-ARMv8.0
          path: angle/ANGLE-Android-ARMv8.0.zip
          if-no-files-found: error
